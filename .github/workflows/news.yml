name: Actualizar noticias

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 6:00 a. m. hora Colombia
  workflow_dispatch:       # botón para correrlo a mano
    inputs:
      enviar_correos:
        description: "¿Mandar también los correos a los suscriptores?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "finanzas-today-bot"
          git config user.email "actions@github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Noticias del día"
          git push
      - name: Mandar correos
        if: ${{ github.event_name == 'schedule' || inputs.enviar_correos }}
        run: python send_digest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
