<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Express · Tus correos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --blue:#1F5BD8; --blue-dark:#1747AD; --ink:#111; --muted:#5E6470; --line:#E4E6EB; --paper:#fff; --cream:#F8F7F3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter Tight', system-ui, sans-serif; background: var(--cream); color: var(--ink); line-height: 1.5; min-height: 100vh; }
  .topbar { height: 8px; background: var(--blue); }
  header { background: var(--paper); border-bottom: 1px solid var(--line); }
  header .in { max-width: 1180px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: -0.04em; color: var(--ink); text-decoration: none; }
  .logo span { color: var(--blue); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; text-transform: uppercase; letter-spacing: 0.08em; }
  .box { max-width: 440px; margin: 40px auto 64px; padding: 0 20px; }
  .card { background: var(--paper); border: 1px solid var(--ink); padding: 32px 28px; }
  h1 { font-weight: 900; font-size: 2rem; letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 6px; }
  .sub { color: var(--muted); margin-bottom: 22px; }
  label { display: block; font-weight: 700; font-size: 0.9rem; margin: 14px 0 6px; }
  input, select { width: 100%; font: inherit; color: var(--ink); padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
  input:focus, select:focus { outline: none; border-color: var(--blue); }
  .btn { width: 100%; margin-top: 22px; font: inherit; font-weight: 800; background: var(--blue); color: #fff; border: 0; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
  .btn:hover { background: var(--blue-dark); }
  .btn:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 16px; font-size: 0.93rem; padding: 12px 14px; border-radius: 8px; display: none; }
  .msg.ok { display: block; background: #E7F6EC; color: #17703A; }
  .msg.err { display: block; background: #FDECEA; color: #B3261E; }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .hidden { display: none; }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .fila input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--blue); }
  a.link { color: var(--blue); font-weight: 700; }
</style>
</head>
<body>
<div class="topbar"></div>
<header><div class="in"><a class="logo" href="index.html">Finanzas<span>Express</span></a></div></header>
<div class="box">
  <div class="card">
    <h1>Tus correos</h1>
    <p class="sub" id="sub">Cargando…</p>
    <div id="panel" class="hidden">
      <div class="fila"><span><b>Recibir las noticias cada mañana</b></span><input type="checkbox" id="news"></div>
      <label for="pais">País de las noticias</label>
      <select id="pais"><option value="co">🇨🇴 Colombia</option><option value="ve">🇻🇪 Venezuela</option><option value="ambos">🇨🇴🇻🇪 Ambos</option></select>
      <button class="btn" id="guardar">Guardar</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  (async function () {
    if (!sb) { $('sub').textContent = 'La página no está configurada.'; return; }
    var r = await sb.auth.getSession();
    var user = r.data.session && r.data.session.user;
    if (!user) {
      $('sub').innerHTML = 'Para cambiar tus correos, primero <a class="link" href="login.html?login">inicia sesión</a>.';
      return;
    }
    var m = user.user_metadata || {};
    $('sub').textContent = 'Cuenta: ' + user.email;
    $('news').checked = m.newsletter !== false;
    $('pais').value = (m.pais === 've' || m.pais === 'ambos') ? m.pais : 'co';
    $('panel').classList.remove('hidden');
    $('guardar').onclick = async function () {
      var u = await sb.auth.updateUser({ data: { newsletter: $('news').checked, pais: $('pais').value } });
      var msg = $('msg');
      if (u.error) { msg.textContent = 'No se pudo guardar. Intenta de nuevo.'; msg.className = 'msg err'; return; }
      msg.textContent = $('news').checked ? 'Listo. Te seguirán llegando las noticias.' : 'Listo. Ya no te llegarán más correos.';
      msg.className = 'msg ok';
    };
  })();
</script>
</body>
</html>
